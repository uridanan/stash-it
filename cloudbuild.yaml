# Stash — Google Cloud Build pipeline: build -> push -> deploy to Cloud Run.
#
# Usage (from the repo root, after the one-time GCP setup in README.md):
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _AR_HOSTNAME=europe-west1-docker.pkg.dev,_AR_REPOSITORY=stash,_SERVICE_NAME=stash,_AUTH_URL=https://stash.example.com
#
# Secrets are NOT passed here. The Cloud Run service reads them from
# Secret Manager at deploy time via --set-secrets (company policy: secrets
# live in Secret Manager / env vars, never in code or build configs).
#
# Required Secret Manager secrets (create before first deploy):
#   stash-database-url     — postgres connection string (Cloud SQL socket form)
#   stash-auth-secret      — Auth.js secret (openssl rand -base64 32)
#   stash-google-id        — Google OAuth client ID
#   stash-google-secret    — Google OAuth client secret

steps:
  # 1. Build the app image from web/ (multi-stage Dockerfile).
  #    Tag with both the commit SHA (immutable) and :latest (convenience).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - PORT=${_PORT}
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest
      - web/

  # 2. Push the SHA tag to Artifact Registry.
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  # 3. Push the :latest tag.
  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest

  # 4. Deploy to Cloud Run.
  #    - --allow-unauthenticated: the app does its own auth (Google Sign-In).
  #    - --set-secrets: mounts Secret Manager values as env vars.
  #    - --set-env-vars: non-secret config only.
  #    - --port: explicitly set container target port.
  #    - --add-cloudsql-instances: connects the service to Cloud SQL unix socket.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - $_AR_HOSTNAME/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --port
      - ${_PORT}
      - --allow-unauthenticated
      - --add-cloudsql-instances
      - $PROJECT_ID:${_REGION}:${_CLOUDSQL_INSTANCE}
      - --set-secrets
      - DATABASE_URL=stash-database-url:latest,AUTH_SECRET=stash-auth-secret:latest,AUTH_GOOGLE_ID=stash-google-id:latest,AUTH_GOOGLE_SECRET=stash-google-secret:latest
      - --set-env-vars
      - AUTH_TRUST_HOST=true,AUTH_URL=${_AUTH_URL}

# Placeholder defaults — override per-project with --substitutions.
substitutions:
  _AR_HOSTNAME: me-west1-docker.pkg.dev # Artifact Registry hostname
  _AR_REPOSITORY: stash-it                  # Artifact Registry repository name
  _SERVICE_NAME: stash-it                   # Cloud Run service (and image) name
  _REGION: me-west1                         # Cloud Run region
  _AUTH_URL: https://stash-it.me-west1.run.app      # public URL of the deployed service
  _CLOUDSQL_INSTANCE: stash-db              # Cloud SQL instance name
  _PORT: "8080"                             # Container listening port

# Images recorded in the build results (also ensures they are pushed).
images:
  - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
  - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY

