<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stash — Options</title>
  <style>
    :root {
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
      --green: #16a34a;
      --red: #dc2626;
      --ink: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: #f9fafb;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    header .logo {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: var(--accent);
    }
    h1 { font-size: 18px; font-weight: 700; }
    p.lead { color: var(--muted); margin-bottom: 24px; font-size: 13px; }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 4px;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); }
    .hint { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
    .hint code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .buttons { display: flex; gap: 10px; margin-top: 8px; }
    button {
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #save { background: var(--accent); color: #fff; }
    #save:hover:not(:disabled) { background: var(--accent-dark); }
    #test { background: #fff; color: var(--ink); border-color: var(--border); }
    #test:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-dark); }
    #message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      min-height: 18px;
    }
    #message.success { color: var(--green); }
    #message.error { color: var(--red); }
    #message.info { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="logo" aria-hidden="true"></span>
      <h1>Stash — Options</h1>
    </header>
    <p class="lead">Connect the extension to your Stash server.</p>

    <label for="server-url">Server URL</label>
    <input id="server-url" type="url" placeholder="http://localhost:3000" spellcheck="false" />
    <p class="hint">The base URL of your Stash instance.</p>

    <label for="api-token">API token</label>
    <input id="api-token" type="password" placeholder="stash_…" spellcheck="false" autocomplete="off" />
    <p class="hint">Create one under <code>Settings → API tokens</code> in the Stash web app. Tokens look like <code>stash_&lt;32 hex&gt;</code>.</p>

    <div class="buttons">
      <button id="save" type="button">Save</button>
      <button id="test" type="button">Test connection</button>
    </div>

    <p id="message" role="status"></p>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
