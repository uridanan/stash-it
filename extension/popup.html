<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Save to Stash</title>
  <style>
    :root {
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
      --green: #16a34a;
      --red: #dc2626;
      --ink: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    header .logo {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: var(--accent);
      flex: none;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    header .options-link {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }
    header .options-link:hover { color: var(--accent-dark); }
    .page {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 14px;
    }
    .page img.favicon {
      width: 20px;
      height: 20px;
      flex: none;
      margin-top: 2px;
      border-radius: 3px;
    }
    .page .meta { min-width: 0; }
    .page .title {
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page .url {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions { padding: 0 14px 12px; }
    #save-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #save-btn:hover:not(:disabled) { background: var(--accent-dark); }
    #save-btn:disabled { opacity: 0.6; cursor: default; }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      padding: 0 14px 14px;
      font-size: 13px;
      line-height: 1.45;
      min-height: 18px;
    }
    #status:empty { padding-bottom: 8px; }
    #status.success { color: var(--green); }
    #status.info { color: var(--accent-dark); }
    #status.error { color: var(--red); }
    #status a {
      color: var(--accent-dark);
      text-decoration: underline;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true"></span>
    <h1>Stash</h1>
    <a id="open-options" class="options-link">Options</a>
  </header>

  <div class="page">
    <img class="favicon hidden" id="favicon" alt="" />
    <div class="meta">
      <div class="title" id="tab-title">Loading…</div>
      <div class="url" id="tab-url"></div>
    </div>
  </div>

  <div class="actions">
    <button id="save-btn" type="button">
      <span class="spinner hidden" id="spinner"></span>
      <span id="save-label">Save for later</span>
    </button>
  </div>

  <div id="status" role="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
